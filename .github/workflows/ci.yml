name: CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: registry.cn-hangzhou.aliyuncs.com/shaoyaoyu/cicd-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 登录阿里云 ACR
        env:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          USERNAME: ${{ secrets.ACR_USERNAME }}
          PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "Registry长度: ${#REGISTRY}"
          echo "Username长度: ${#USERNAME}"
          echo "Password长度: ${#PASSWORD}"
          echo "$PASSWORD" | docker login "$REGISTRY" -u "$USERNAME" --password-stdin

      - name: 构建并推送镜像
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: 查看镜像
        run: docker images
