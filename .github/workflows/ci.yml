name: CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: registry.cn-hangzhou.aliyuncs.com/shaoyaoyu/cicd-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 调试信息
        run: |
          echo "Registry长度: $(echo -n '${{ secrets.ACR_REGISTRY }}' | wc -c)"
          echo "Username长度: $(echo -n '${{ secrets.ACR_USERNAME }}' | wc -c)"
          echo "Password长度: $(echo -n '${{ secrets.ACR_PASSWORD }}' | wc -c)"

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送镜像
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: 查看镜像
        run: docker images
